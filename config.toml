baseURL = "https://jbdoumenjou.github.io/"
title = "JB's blog"
theme = "PaperMod"

DefaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableInlineShortcodes = true
buildDrafts = false
pagination.pagerSize = 10

[params]
	env = "production"
	description = "Just another g33k's blog"
	author = "Jean-Baptiste Doumenjou"
	defaultTheme = "auto"
	ShowReadingTime = true
	ShowPostNavLinks = true
	ShowBreadCrumbs = true
	ShowCodeCopyButtons = true
	ShowWordCount = true
	ShowRssButtonInSectionTermList = true
	ShowToc = true
	TocOpen = false
	comments = true
	hidemeta = false


	[[params.socialIcons]]
		name = "github"
		url = "https://github.com/jbdoumenjou"
	[[params.socialIcons]]
		name = "rss"
		url = "index.xml"

[languages]
	[languages.en]
		label = "EN"
		contentDir = "content/en"
		weight = 1
		title = "JB's blog"
		[languages.en.params.homeInfoParams]
			Title = "Peregrinations of an ordinary g33k"
			Content = "Dear Travelers, welcome to this joyful bric-a-brac of ideas and experiments. Come closer, don't be afraid, take your time."
		[[languages.en.menu.main]]
			identifier = "posts"
			name = "Articles"
			url = "/post/"
			weight = 10
		[[languages.en.menu.main]]
			identifier = "about"
			name = "About"
			url = "/about/"
			weight = 20

	[languages.fr]
		label = "FR"
		contentDir = "content/fr"
		weight = 2
		title = "Blog de JB"
		[languages.fr.params.homeInfoParams]
			Title = "Pérégrinations d'un g33k ordinaire"
			Content = "Voyageurs, voyageuses, bienvenue dans ce joyeux bric à brac d'idées et d'expérimentations. Approchez, n'ayez crainte, prenez votre temps."
		[[languages.fr.menu.main]]
			identifier = "posts"
			name = "Articles"
			url = "/fr/post/"
			weight = 10
		[[languages.fr.menu.main]]
			identifier = "about"
			name = "À propos"
			url = "/fr/about/"
			weight = 20

[markup]
	[markup.goldmark]
		[markup.goldmark.renderer]
			# the cipher posts use <details>/<summary> for puzzle answers
			unsafe = true
	[markup.highlight]
		noClasses = false
		codeFences = true
		guessSyntax = true

[outputs]
	home = ["HTML", "RSS", "JSON"]

[sitemap]
	changefreq = "monthly"
	priority = 0.5
	filename = "sitemap.xml"
