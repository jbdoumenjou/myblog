<script src="https://giscus.app/client.js"
        data-repo="jbdoumenjou/myblog"
        data-repo-id="MDEwOlJlcG9zaXRvcnk0MDc5MzA2ODU="
        data-category="Announcements"
        data-category-id="DIC_kwDOGFCHPc4DETHf"
        data-mapping="pathname"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="{{ if eq .Lang "fr" }}fr{{ else }}en{{ end }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>

{{- /* keep giscus in step with PaperMod's own light/dark toggle */ -}}
<script>
  (function () {
    function giscusTheme() {
      return document.body.classList.contains('dark') ? 'dark' : 'light';
    }
    function send(theme) {
      var f = document.querySelector('iframe.giscus-frame');
      if (!f) return;
      f.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
    }
    window.addEventListener('message', function (e) {
      if (e.origin === 'https://giscus.app') send(giscusTheme());
    });
    var btn = document.getElementById('theme-toggle');
    if (btn) btn.addEventListener('click', function () { setTimeout(function () { send(giscusTheme()); }, 50); });
  })();
</script>
